<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="510" viewBox="0 0 1200 510" role="img" aria-labelledby="title desc">
<title id="title">I.39 辅助交点的三种位置</title><desc id="desc">原创坐标教学图。左栏内点，中央延长线，两者不满足等积前提。右栏等积且同侧，E=D，结论平行。阴影显示余片EDC。未画出的A=E边界用注释说明。</desc>
<rect width="1200" height="510" fill="#f7fafc"/>
<style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172b42} .title{font-size:20px;font-weight:600}.note{font-size:15px}.label{font-size:17px;font-weight:600}</style>
<text x="28" y="30" class="title">I.39：相交位置与整体—部分关系（原创现代坐标教学图）</text>
<rect x="16" y="49" width="384" height="390" rx="12" fill="white" stroke="#d2dee8"/>
<text x="34" y="80" class="title">内点：t = 1/2</text>
<text x="34" y="106" class="note">A=(1, 2)，D=(3, 4)</text>
<polygon points="58,345 193,165 238,345" fill="#dfeefb" stroke="#5485b0" stroke-width="2"/>
<polygon points="125.5,255 193,165 238,345" fill="#ffd699" fill-opacity="0.75" stroke="#d28a22" stroke-width="1.5"/>
<polygon points="103,255 58,345 238,345" fill="none" stroke="#315f85" stroke-width="2"/>
<line x1="40.0" y1="345" x2="350.5" y2="345" stroke="#315f85" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="40.0" y1="255" x2="350.5" y2="255" stroke="#218274" stroke-width="1.7" stroke-dasharray="6 4"/>
<polyline points="58,345 193,165 125.5,255" fill="none" stroke="#8755a7" stroke-width="2.6"/>
<circle cx="58" cy="345" r="3.7" fill="#172b42"/>
<text x="40" y="366" class="label">B</text>
<circle cx="238" cy="345" r="3.7" fill="#172b42"/>
<text x="243" y="366" class="label">C</text>
<circle cx="103" cy="255" r="3.7" fill="#172b42"/>
<text x="83" y="244" class="label">A</text>
<circle cx="193" cy="165" r="3.7" fill="#172b42"/>
<text x="200" y="156" class="label">D</text>
<circle cx="125.5" cy="255" r="3.7" fill="#172b42"/>
<text x="133.5" y="275" class="label">E</text>
<text x="34" y="392" class="note">S(DBC)=8，S(EBC)=4</text>
<text x="34" y="419" class="note">不等积演示，非完整题设实例</text>
<rect x="414" y="49" width="384" height="390" rx="12" fill="white" stroke="#d2dee8"/>
<text x="432" y="80" class="title">延长：t = 2</text>
<text x="432" y="106" class="note">A=(1, 4)，D=(3, 2)</text>
<polygon points="456,345 591,255 636,345" fill="#dfeefb" stroke="#5485b0" stroke-width="2"/>
<polygon points="726,165 591,255 636,345" fill="#ffd699" fill-opacity="0.75" stroke="#d28a22" stroke-width="1.5"/>
<polygon points="501,165 456,345 636,345" fill="none" stroke="#315f85" stroke-width="2"/>
<line x1="438.0" y1="345" x2="748.5" y2="345" stroke="#315f85" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="438.0" y1="165" x2="748.5" y2="165" stroke="#218274" stroke-width="1.7" stroke-dasharray="6 4"/>
<polyline points="456,345 591,255 726,165" fill="none" stroke="#8755a7" stroke-width="2.6"/>
<circle cx="456" cy="345" r="3.7" fill="#172b42"/>
<text x="438" y="366" class="label">B</text>
<circle cx="636" cy="345" r="3.7" fill="#172b42"/>
<text x="641" y="366" class="label">C</text>
<circle cx="501" cy="165" r="3.7" fill="#172b42"/>
<text x="481" y="154" class="label">A</text>
<circle cx="591" cy="255" r="3.7" fill="#172b42"/>
<text x="598" y="246" class="label">D</text>
<circle cx="726" cy="165" r="3.7" fill="#172b42"/>
<text x="734" y="185" class="label">E</text>
<text x="432" y="392" class="note">S(EBC)=8，S(DBC)=4</text>
<text x="432" y="419" class="note">不等积演示，非完整题设实例</text>
<rect x="812" y="49" width="384" height="390" rx="12" fill="white" stroke="#d2dee8"/>
<text x="830" y="80" class="title">合法：t = 1</text>
<text x="830" y="106" class="note">A=(1, 3)，D=(5, 3)</text>
<polygon points="854,345 1079,210 1034,345" fill="#dfeefb" stroke="#5485b0" stroke-width="2"/>
<polygon points="1079,210 1079,210 1034,345" fill="#ffd699" fill-opacity="0.75" stroke="#d28a22" stroke-width="1.5"/>
<polygon points="899,210 854,345 1034,345" fill="none" stroke="#315f85" stroke-width="2"/>
<line x1="836.0" y1="345" x2="1146.5" y2="345" stroke="#315f85" stroke-width="1.7" stroke-dasharray="6 4"/>
<line x1="836.0" y1="210" x2="1146.5" y2="210" stroke="#218274" stroke-width="1.7" stroke-dasharray="6 4"/>
<polyline points="854,345 1079,210 1079,210" fill="none" stroke="#8755a7" stroke-width="2.6"/>
<circle cx="854" cy="345" r="3.7" fill="#172b42"/>
<text x="836" y="366" class="label">B</text>
<circle cx="1034" cy="345" r="3.7" fill="#172b42"/>
<text x="1039" y="366" class="label">C</text>
<circle cx="899" cy="210" r="3.7" fill="#172b42"/>
<text x="879" y="199" class="label">A</text>
<circle cx="1079" cy="210" r="3.7" fill="#172b42"/>
<text x="1086" y="201" class="label">D=E</text>
<text x="830" y="392" class="note">S(ABC)=S(DBC)=6</text>
<text x="830" y="419" class="note">等积、同侧、A≠D；AD ∥ BC</text>
<text x="28" y="467" class="note">橙色为余片 EDC；两非等积分支展示反证中的严格大小关系，不能假称满足等积前提。</text>
<text x="28" y="493" class="note">另注（未画）：若 A=E，辅助支持线仍为 A+λ(C−B)，但“AE”不能作为两不同点所定直线的名称。</text>
</svg>
