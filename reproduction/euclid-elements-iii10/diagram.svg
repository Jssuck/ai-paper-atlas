<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480" role="img" aria-labelledby="title desc">
<title id="title">Two distinct circles, two common points</title><desc id="desc">Original coordinate illustration. Radius five circles centered at zero zero and six zero meet at three plus or minus four. Their radical axis is x equals three. This is a valid two-intersection diagram, not Euclid's impossible four-intersection assumption.</desc>
<rect width="900" height="480" fill="#fff"/><g font-family="sans-serif" fill="#15283c"><text x="35" y="35" font-size="23">III.10 · Distinct circles: at most two common points</text>
<circle cx="285" cy="245" r="175" fill="#e6f3ff" fill-opacity=".55" stroke="#2267b2" stroke-width="3"/><circle cx="495" cy="245" r="175" fill="#fff0df" fill-opacity=".55" stroke="#b46521" stroke-width="3"/>
<path d="M285 245H495 M390 65V425" stroke="#52697d" stroke-width="2" stroke-dasharray="7 5"/><path d="M285 245L390 105L495 245M285 245L390 385L495 245" fill="none" stroke="#6a7e91" stroke-width="1.5"/>
<g fill="#172d45"><circle cx="285" cy="245" r="5"/><circle cx="495" cy="245" r="5"/><circle cx="390" cy="105" r="5"/><circle cx="390" cy="385" r="5"/></g>
<text x="203" y="270" font-size="19">O₁ = (0, 0)</text><text x="505" y="270" font-size="19">O₂ = (6, 0)</text><text x="400" y="98" font-size="19">P = (3, 4)</text><text x="400" y="410" font-size="19">Q = (3, −4)</text>
<text x="690" y="130" font-size="19">R₁² = R₂² = 25</text><text x="690" y="170" font-size="19">Radical axis:</text><text x="690" y="201" font-size="21">x = 3</text><text x="690" y="250" font-size="18">y² = 16</text><text x="35" y="460" font-size="17">Original valid example; schematic teaching aid, not a proof by drawing.</text></g></svg>
