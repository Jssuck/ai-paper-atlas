<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="title desc">
<title id="title">III.21: same-side equality and opposite-side supplement</title>
<desc id="desc">Three circle panels: acute angles in major segment, obtuse angles in minor segment, and opposite-side unequal supplementary angles. Blue horizontal chord is common.</desc>
<rect width="1200" height="480" fill="#fff"/>
<g font-family="sans-serif" font-size="16" fill="#142b3e">
<text x="200" y="35" text-anchor="middle" font-size="22">Same major segment</text>
<circle cx="200" cy="245" r="135" fill="#f6f9fc" stroke="#64748b" stroke-width="2"/>
<line x1="119" y1="137" x2="281" y2="137" stroke="#1677b8" stroke-width="4"/>
<line x1="200" y1="380" x2="119" y2="137" stroke="#a93d2f" stroke-width="2"/>
<line x1="200" y1="380" x2="281" y2="137" stroke="#a93d2f" stroke-width="2"/>
<line x1="65" y1="245" x2="119" y2="137" stroke="#178250" stroke-width="2"/>
<line x1="65" y1="245" x2="281" y2="137" stroke="#178250" stroke-width="2"/>
<circle cx="119" cy="137" r="4" fill="#182e41"/>
<text x="101" y="158" font-weight="bold">B</text>
<circle cx="281" cy="137" r="4" fill="#182e41"/>
<text x="291" y="158" font-weight="bold">C</text>
<circle cx="200" cy="380" r="4" fill="#182e41"/>
<text x="210" y="401" font-weight="bold">A</text>
<circle cx="65" cy="245" r="4" fill="#182e41"/>
<text x="75" y="266" font-weight="bold">D</text>
<text x="200" y="425" text-anchor="middle">cot A = cot D = 4/3</text>
<text x="600" y="35" text-anchor="middle" font-size="22">Same minor segment</text>
<circle cx="600" cy="245" r="135" fill="#f6f9fc" stroke="#64748b" stroke-width="2"/>
<line x1="519" y1="137" x2="681" y2="137" stroke="#1677b8" stroke-width="4"/>
<line x1="600" y1="110" x2="519" y2="137" stroke="#a93d2f" stroke-width="2"/>
<line x1="600" y1="110" x2="681" y2="137" stroke="#a93d2f" stroke-width="2"/>
<line x1="637.8" y1="115.4" x2="519" y2="137" stroke="#178250" stroke-width="2"/>
<line x1="637.8" y1="115.4" x2="681" y2="137" stroke="#178250" stroke-width="2"/>
<circle cx="519" cy="137" r="4" fill="#182e41"/>
<text x="501" y="158" font-weight="bold">B</text>
<circle cx="681" cy="137" r="4" fill="#182e41"/>
<text x="691" y="158" font-weight="bold">C</text>
<circle cx="600" cy="110" r="4" fill="#182e41"/>
<text x="610" y="98" font-weight="bold">A</text>
<circle cx="637.8" cy="115.4" r="4" fill="#182e41"/>
<text x="647.8" y="103.4" font-weight="bold">D</text>
<text x="600" y="425" text-anchor="middle">cot A = cot D = -4/3</text>
<text x="1000" y="35" text-anchor="middle" font-size="22">Opposite sides</text>
<circle cx="1000" cy="245" r="135" fill="#f6f9fc" stroke="#64748b" stroke-width="2"/>
<line x1="919" y1="137" x2="1081" y2="137" stroke="#1677b8" stroke-width="4"/>
<line x1="1000" y1="110" x2="919" y2="137" stroke="#a93d2f" stroke-width="2"/>
<line x1="1000" y1="110" x2="1081" y2="137" stroke="#a93d2f" stroke-width="2"/>
<line x1="1000" y1="380" x2="919" y2="137" stroke="#178250" stroke-width="2"/>
<line x1="1000" y1="380" x2="1081" y2="137" stroke="#178250" stroke-width="2"/>
<circle cx="919" cy="137" r="4" fill="#182e41"/>
<text x="901" y="158" font-weight="bold">B</text>
<circle cx="1081" cy="137" r="4" fill="#182e41"/>
<text x="1091" y="158" font-weight="bold">C</text>
<circle cx="1000" cy="110" r="4" fill="#182e41"/>
<text x="1010" y="98" font-weight="bold">A</text>
<circle cx="1000" cy="380" r="4" fill="#182e41"/>
<text x="1010" y="401" font-weight="bold">D</text>
<text x="1000" y="425" text-anchor="middle">cot A = -4/3; cot D = 4/3</text>
<text x="600" y="465" text-anchor="middle">O=(0,0), radius=5; B=(-3,4), C=(3,4). Diagram is schematic, not a proof.</text>
</g></svg>
