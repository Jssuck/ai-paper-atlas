<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="590" viewBox="0 0 1100 590" role="img">
<title>Two chords from the midpoint of an arc</title><desc>Unit circle with P=(0,1), U and V at height one half. The two chords are reflected across the vertical diameter. Near segments are blue, remote segments orange.</desc>
<style>text{font-family:Arial,Helvetica,sans-serif;fill:#152f43} .title{font-size:22px;font-weight:700}.label{font-size:17px}.small{font-size:15px}.note{font-size:14px}</style>
<rect width="1100" height="590" fill="#f7fafc"/>
<text x="28.00" y="36.00" class="title" >Circle example: near x, remote a, half-arc chord b = PU = PV</text>
<text x="28.00" y="63.00" class="small" >P is the midpoint of the minor arc UV. The base UV cuts each chord PQ at S.</text>
<circle cx="285" cy="302" r="180" fill="#edf5f9" stroke="#8399aa" stroke-width="2"/>
<line x1="129.115" y1="212.000" x2="440.885" y2="212.000" stroke="#596775" stroke-width="2.5"/>
<line x1="285.000" y1="122.000" x2="129.115" y2="212.000" stroke="#596775" stroke-width="1.5" stroke-dasharray="7 5"/>
<line x1="285.000" y1="122.000" x2="440.885" y2="212.000" stroke="#596775" stroke-width="1.5" stroke-dasharray="7 5"/>
<line x1="285.000" y1="122.000" x2="233.038" y2="212.000" stroke="#146b9c" stroke-width="5"/>
<line x1="233.038" y1="212.000" x2="129.115" y2="392.000" stroke="#c76324" stroke-width="5"/>
<text x="205.04" y="204.00" class="label" >S1</text>
<text x="101.12" y="384.00" class="label" >Q1</text>
<line x1="285.000" y1="122.000" x2="336.962" y2="212.000" stroke="#146b9c" stroke-width="5"/>
<line x1="336.962" y1="212.000" x2="440.885" y2="392.000" stroke="#c76324" stroke-width="5"/>
<text x="346.96" y="204.00" class="label" >S2</text>
<text x="450.88" y="384.00" class="label" >Q2</text>
<circle cx="285.000" cy="122.000" r="3" fill="#152f43"/>
<text x="278.00" y="110.00" class="label" >P</text>
<circle cx="129.115" cy="212.000" r="3" fill="#152f43"/>
<text x="102.12" y="204.00" class="label" >U</text>
<circle cx="440.885" cy="212.000" r="3" fill="#152f43"/>
<text x="451.88" y="204.00" class="label" >V</text>
<circle cx="285.000" cy="302.000" r="3" fill="#152f43"/>
<text x="277.00" y="323.00" class="label" >O</text>
<text x="540.00" y="122.00" class="label" >Construction</text>
<text x="540.00" y="151.00" class="small" >R = 1; base y = 1/2; directions +/-30 deg</text>
<text x="540.00" y="201.00" class="label" >Measured segments</text>
<text x="540.00" y="230.00" class="small" >x = 1/sqrt(3); a = 2/sqrt(3); b = 1</text>
<text x="540.00" y="280.00" class="label" >Page 369 equation</text>
<text x="540.00" y="309.00" class="small" >x(x + a) = b^2</text>
<text x="540.00" y="359.00" class="label" >Positive root</text>
<text x="540.00" y="388.00" class="small" >x = 2b^2 / (sqrt(a^2 + 4b^2) + a)</text>
<text x="540.00" y="438.00" class="label" >Converse: symbols reset</text>
<text x="540.00" y="467.00" class="small" >near = a; remote = x; a(a + x) = b^2</text>
<text x="28.00" y="550.00" class="small" >Blue: near segments PS1, PS2. Orange: remote segments S1Q1, S2Q2.</text>
<text x="28.00" y="576.00" class="note" >Original diagram generated by this package; no scanned source image is embedded.</text>
</svg>
