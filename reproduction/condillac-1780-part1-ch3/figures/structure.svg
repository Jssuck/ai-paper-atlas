<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="510" viewBox="0 0 1100 510">
<rect width="1100" height="510" fill="#f6f8fc"/>
<style>text{font-family:DejaVu Sans,sans-serif;fill:#17223b}.title{font-size:24px;font-weight:bold}.label{font-size:22px}.small{font-size:18px}.node{fill:white;stroke:#40577a;stroke-width:2}.edge{stroke:#71819b;stroke-width:3}</style>
<text x="550" y="42" class="title" text-anchor="middle">Same leaves and operations; different structure</text>
<line x1="550" y1="70" x2="550" y2="440" stroke="#d4dbe7" stroke-width="2"/>
<line x1="275" y1="135" x2="180" y2="240" class="edge"/>
<line x1="275" y1="135" x2="390" y2="240" class="edge"/>
<line x1="180" y1="240" x2="120" y2="345" class="edge"/>
<line x1="180" y1="240" x2="240" y2="345" class="edge"/>
<circle cx="275" cy="135" r="30" class="node"/>
<text x="275" y="142" class="label" text-anchor="middle">SUB</text>
<circle cx="180" cy="240" r="30" class="node"/>
<text x="180" y="247" class="label" text-anchor="middle">SUB</text>
<circle cx="390" cy="240" r="30" class="node"/>
<text x="390" y="247" class="label" text-anchor="middle">1</text>
<circle cx="120" cy="345" r="30" class="node"/>
<text x="120" y="352" class="label" text-anchor="middle">2</text>
<circle cx="240" cy="345" r="30" class="node"/>
<text x="240" y="352" class="label" text-anchor="middle">1</text>
<text x="275" y="407" class="title" text-anchor="middle">(2 - 1) - 1 = 0</text>
<text x="275" y="442" class="small" text-anchor="middle">Leaf sequence: (2, 1, 1)</text>
<line x1="825" y1="135" x2="920" y2="240" class="edge"/>
<line x1="825" y1="135" x2="710" y2="240" class="edge"/>
<line x1="920" y1="240" x2="860" y2="345" class="edge"/>
<line x1="920" y1="240" x2="980" y2="345" class="edge"/>
<circle cx="825" cy="135" r="30" class="node"/>
<text x="825" y="142" class="label" text-anchor="middle">SUB</text>
<circle cx="920" cy="240" r="30" class="node"/>
<text x="920" y="247" class="label" text-anchor="middle">SUB</text>
<circle cx="710" cy="240" r="30" class="node"/>
<text x="710" y="247" class="label" text-anchor="middle">2</text>
<circle cx="860" cy="345" r="30" class="node"/>
<text x="860" y="352" class="label" text-anchor="middle">1</text>
<circle cx="980" cy="345" r="30" class="node"/>
<text x="980" y="352" class="label" text-anchor="middle">1</text>
<text x="825" y="407" class="title" text-anchor="middle">2 - (1 - 1) = 2</text>
<text x="825" y="442" class="small" text-anchor="middle">Leaf sequence: (2, 1, 1)</text>
<text x="550" y="487" class="small" text-anchor="middle">Original teaching diagram, not an illustration from Condillac.</text>
</svg>
