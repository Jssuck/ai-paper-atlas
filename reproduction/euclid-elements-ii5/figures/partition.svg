<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" role="img" aria-labelledby="title desc">
<title id="title">Euclid II.5: equal complements and the missing square</title>
<desc id="desc">A C D B are collinear. C B F E is the large square. H lies on diagonal B E. Four tiles CH, DM, HF, LG have areas 6, 9, 6, 4. Rectangle AH has area 21.</desc>
<rect width="760" height="460" fill="white"/>
<polygon points="105,90 380,90 380,255 105,255" fill="#e5e7eb" stroke="#111827" stroke-width="2"/>
<polygon points="380,90 490,90 490,255 380,255" fill="#93c5fd" stroke="#111827" stroke-width="2"/>
<polygon points="490,90 655,90 655,255 490,255" fill="#fcd34d" stroke="#111827" stroke-width="2"/>
<polygon points="490,255 655,255 655,365 490,365" fill="#93c5fd" stroke="#111827" stroke-width="2"/>
<polygon points="380,255 490,255 490,365 380,365" fill="#bbf7d0" stroke="#111827" stroke-width="2"/>
<path d="M655,90 L380,365" stroke="#be123c" stroke-width="2" fill="none"/>
<circle cx="105" cy="90" r="3" fill="#111827"/><text x="89" y="78" font-size="18" font-family="sans-serif">A</text>
<circle cx="380" cy="90" r="3" fill="#111827"/><text x="364" y="78" font-size="18" font-family="sans-serif">C</text>
<circle cx="490" cy="90" r="3" fill="#111827"/><text x="474" y="78" font-size="18" font-family="sans-serif">D</text>
<circle cx="655" cy="90" r="3" fill="#111827"/><text x="639" y="78" font-size="18" font-family="sans-serif">B</text>
<circle cx="380" cy="365" r="3" fill="#111827"/><text x="363" y="385" font-size="18" font-family="sans-serif">E</text>
<circle cx="655" cy="365" r="3" fill="#111827"/><text x="638" y="385" font-size="18" font-family="sans-serif">F</text>
<circle cx="490" cy="365" r="3" fill="#111827"/><text x="473" y="385" font-size="18" font-family="sans-serif">G</text>
<circle cx="490" cy="255" r="3" fill="#111827"/><text x="497" y="245" font-size="18" font-family="sans-serif">H</text>
<circle cx="380" cy="255" r="3" fill="#111827"/><text x="363" y="275" font-size="18" font-family="sans-serif">L</text>
<circle cx="655" cy="255" r="3" fill="#111827"/><text x="638" y="275" font-size="18" font-family="sans-serif">M</text>
<circle cx="105" cy="255" r="3" fill="#111827"/><text x="88" y="275" font-size="18" font-family="sans-serif">K</text>
<text x="225" y="170" text-anchor="middle" font-size="17" font-family="sans-serif">AL = 15</text>
<text x="420" y="170" text-anchor="middle" font-size="17" font-family="sans-serif">CH = 6</text>
<text x="560" y="170" text-anchor="middle" font-size="17" font-family="sans-serif">DM = 9</text>
<text x="420" y="320" text-anchor="middle" font-size="17" font-family="sans-serif">LG = 4</text>
<text x="560" y="320" text-anchor="middle" font-size="17" font-family="sans-serif">HF = 6</text>
<text x="380" y="415" text-anchor="middle" font-size="18" font-family="sans-serif">AH = AL + CH = 21; gnomon = CH + DM + HF = 21; 21 + 4 = 25</text></svg>
