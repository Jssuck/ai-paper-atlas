<circle cx="346.32" cy="365" r="9" fill="#ffffff" stroke="#aabac2" stroke-width="2"/>
<circle cx="427.68" cy="365" r="9" fill="#bd6424" stroke="#bd6424" stroke-width="2"/>
<text x="84" y="419" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#203544">a</text>
<circle cx="264.96" cy="411" r="9" fill="#087f8c" stroke="#087f8c" stroke-width="2"/>
<circle cx="346.32" cy="411" r="9" fill="#ffffff" stroke="#aabac2" stroke-width="2"/>
<circle cx="427.68" cy="411" r="9" fill="#ffffff" stroke="#aabac2" stroke-width="2"/>
<text x="72" y="473" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#203544">w is in B and C, but outside A.</text>
