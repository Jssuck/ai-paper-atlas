<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1100" viewBox="0 0 1500 1100" role="img" aria-labelledby="title desc">
<title id="title">Same witnesses, different conclusions: five finite membership models</title>
<desc id="desc">The top three models satisfy E(A,B), I(B,C), and O(C,A), while C minus B is outside A, inside A, or partly inside A. The bottom two models both satisfy I(A,B) and E(B,C), but O(C,A) is false in the left model and true in the right. Filled dots show membership; open circles show nonmembership. Highlighted rows are the existential premise witnesses.</desc>
<rect x="0" y="0" width="1500" height="1100" rx="0" fill="#eef4f5" stroke="none"/>
<text x="48" y="60" font-family="DejaVu Sans, sans-serif" font-size="37" font-weight="bold" fill="#203544">Follow the same witness</text>
<text x="48" y="99" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#203544">Three models of E(A,B) and I(B,C). In each, w proves O(C,A).</text>
<text x="48" y="137" font-family="DejaVu Sans, sans-serif" font-size="20" font-weight="normal" fill="#526b79">Filled dot = member    Open circle = not a member    Highlight = premise witness</text>
<rect x="48" y="168" width="452" height="340" rx="14" fill="#ffffff" stroke="#d3dfe3"/>
<text x="72" y="210" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#203544">Remainder outside A</text>
<text x="72" y="245" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#526b79">C minus B = {r}</text>
<text x="78" y="288" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#526b79">Object</text>
