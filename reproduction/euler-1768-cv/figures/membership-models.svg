<text x="1024" y="210" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#203544">Mixed remainder</text>
<text x="1024" y="245" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#526b79">C minus B = {q, r}</text>
<text x="1030" y="288" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#526b79">Object</text>
