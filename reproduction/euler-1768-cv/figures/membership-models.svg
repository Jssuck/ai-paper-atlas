<circle cx="1298.32" cy="365" r="9" fill="#ffffff" stroke="#aabac2" stroke-width="2"/>
<circle cx="1379.68" cy="365" r="9" fill="#bd6424" stroke="#bd6424" stroke-width="2"/>
<text x="1036" y="419" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#203544">q</text>
<circle cx="1216.96" cy="411" r="9" fill="#ffffff" stroke="#aabac2" stroke-width="2"/>
