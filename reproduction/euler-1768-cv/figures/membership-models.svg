<text x="1024" y="473" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#203544">w is in B and C, but outside A.</text>
<text x="48" y="548" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="normal" fill="#526b79">These are possible models. A remainder, or an extra outside object, need not exist.</text>
<text x="48" y="611" font-family="DejaVu Sans, sans-serif" font-size="32" font-weight="bold" fill="#203544">Same premises, opposite outcomes</text>
<text x="48" y="650" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="normal" fill="#203544">Both models satisfy I(A,B) and E(B,C). The proposed O(C,A) is not guaranteed.</text>
<rect x="48" y="681" width="690" height="340" rx="14" fill="#ffffff" stroke="#d3dfe3"/>
<text x="72" y="723" font-family="DejaVu Sans, sans-serif" font-size="25" font-weight="bold" fill="#203544">Countermodel: O(C,A) is false</text>
<text x="72" y="758" font-family="DejaVu Sans, sans-serif" font-size="18" font-weight="normal" fill="#526b79">U = {s, v}; all three classes are nonempty</text>
