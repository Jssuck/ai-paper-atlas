<text x="418.68" y="288" font-family="DejaVu Sans, sans-serif" font-size="22" font-weight="bold" fill="#bd6424">C</text>
<rect x="64" y="299" width="420" height="39" rx="8" fill="#fff4ce" stroke="none"/>
<text x="84" y="327" font-family="DejaVu Sans, sans-serif" font-size="23" font-weight="bold" fill="#203544">w</text>
