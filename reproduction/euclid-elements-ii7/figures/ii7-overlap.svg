<svg xmlns="http://www.w3.org/2000/svg" width="850" height="560" viewBox="0 0 850 560">
<rect width="850" height="560" fill="#fff"/>
<g font-family="sans-serif" font-size="18">
<text x="40" y="35" font-size="23">II.7 — overlapping rectangles and a gnomon</text>
<polygon points="100,90 316,90 316,234 100,234" fill="#dbeafe" stroke="#334155" stroke-width="2"/>
<polygon points="316,234 460,234 460,450 316,450" fill="#c7d2fe" stroke="#334155" stroke-width="2"/>
<polygon points="316,90 460,90 460,234 316,234" fill="#fbbf24" stroke="#334155" stroke-width="2"/>
<polygon points="100,234 316,234 316,450 100,450" fill="#dcfce7" stroke="#334155" stroke-width="2"/>
<polyline points="100,450 460,90" fill="none" stroke="#475569" stroke-width="2"/>
<text x="76.0" y="80.0">A</text>
<text x="468.0" y="80.0">B</text>
<text x="310.0" y="80.0">C</text>
<text x="76.0" y="474.0">D</text>
<text x="468.0" y="474.0">E</text>
<text x="468.0" y="239.0">F</text>
<text x="323.0" y="226.0">G</text>
<text x="76.0" y="239.0">H</text>
<text x="310.0" y="474.0">N</text>
<text x="175" y="160">AG = 6</text>
<text x="365" y="340">GE = 6</text>
<text x="340" y="160">CF = 4</text>
<text x="175" y="340">DG = 9</text>
<text x="510" y="100">a = AC = 3; b = CB = 2</text>
<text x="510" y="132">AF = top strip = 10</text>
<text x="510" y="164">CE = right strip = 10</text>
<text x="510" y="196">Overlap CF = 4</text>
<text x="510" y="228">Union (gnomon) = 16</text>
<text x="510" y="260">AF + CE = 16 + 4</text>
<text x="510" y="292">Whole + CF = 25 + 4</text>
<text x="510" y="324">2 AF + DG = 20 + 9</text>
<text x="510" y="356">KLM names the gnomon,</text>
<text x="510" y="388">not a triangle.</text>
<text x="70" y="520">Original teaching diagram; exact rational model; not an ancient source image.</text>
</g></svg>
