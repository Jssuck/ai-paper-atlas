<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="360" viewBox="0 0 1000 360" role="img" aria-labelledby="title desc">
<title id="title">III.12 external contact and the betweenness distinction</title><desc id="desc">Left: two externally tangent circles of radii 90 and 60, centers F and G, contact A between centers. Right: internal tangency also gives collinearity but contact lies beyond G, not between centers. This is an original modern illustration, not the impossible counterassumption figure.</desc>
<rect width="1000" height="360" fill="#fafbfd"/>
<g font-family="sans-serif" fill="#17324d"><text x="40" y="32" font-size="22">External tangency: F — A — G</text><text x="540" y="32" font-size="22">Internal tangency: F — G — A</text></g>
<circle cx="150" cy="175" r="90" fill="#dbeafe" stroke="#2363a6" stroke-width="3"/><circle cx="300" cy="175" r="60" fill="#e0f2e9" stroke="#24805a" stroke-width="3"/>
<line x1="150" y1="175" x2="300" y2="175" stroke="#172b4d" stroke-width="2"/>
<g fill="#172b4d"><circle cx="150" cy="175" r="4"/><circle cx="240" cy="175" r="5"/><circle cx="300" cy="175" r="4"/></g>
<g font-family="sans-serif" font-size="19" fill="#17324d"><text x="142" y="201">F</text><text x="233" y="201">A</text><text x="292" y="201">G</text><text x="185" y="164">R</text><text x="265" y="164">r</text><text x="66" y="300">FG = R + r; A strictly between F and G</text></g>
<circle cx="690" cy="175" r="90" fill="#dbeafe" stroke="#2363a6" stroke-width="3"/><circle cx="720" cy="175" r="60" fill="#e0f2e9" stroke="#24805a" stroke-width="3"/>
<line x1="690" y1="175" x2="780" y2="175" stroke="#172b4d" stroke-width="2"/>
<g fill="#172b4d"><circle cx="690" cy="175" r="4"/><circle cx="720" cy="175" r="4"/><circle cx="780" cy="175" r="5"/></g>
<g font-family="sans-serif" font-size="19" fill="#17324d"><text x="680" y="201">F</text><text x="714" y="201">G</text><text x="778" y="201">A</text><text x="568" y="300">Collinear, but disk interiors overlap</text><text x="40" y="338" font-size="15">Original teaching diagram. Positive radii; illustrations are exact in their own coordinate scales.</text></g>
</svg>
