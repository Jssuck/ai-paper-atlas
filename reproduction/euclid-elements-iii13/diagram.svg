<rect width="1000" height="350" fill="#fff"/><g font-family="sans-serif" font-size="17" fill="#172638">
<text x="25" y="28">III.13: three exact model configurations</text>
<g transform="translate(30,65)"><text x="15" y="0">External contact</text><circle cx="100" cy="115" r="90" fill="#87b5ef" fill-opacity=".2" stroke="#2465a8" stroke-width="2"/><circle cx="244" cy="115" r="54" fill="#efbc87" fill-opacity=".2" stroke="#bd6a1a" stroke-width="2"/><line x1="100" y1="115" x2="244" y2="115" stroke="#555"/><circle cx="190" cy="115" r="4" fill="#a32c2c"/><text x="92" y="140">O</text><text x="240" y="140">P</text><text x="184" y="102">T</text><text x="15" y="235">R=5, r=3, d=8</text></g>
<g transform="translate(360,65)"><text x="15" y="0">Internal contact</text><circle cx="100" cy="115" r="90" fill="#87b5ef" fill-opacity=".2" stroke="#2465a8" stroke-width="2"/><circle cx="136" cy="115" r="54" fill="#efbc87" fill-opacity=".2" stroke="#bd6a1a" stroke-width="2"/><line x1="100" y1="115" x2="190" y2="115" stroke="#555"/><circle cx="190" cy="115" r="4" fill="#a32c2c"/><text x="90" y="140">O</text><text x="133" y="140">P</text><text x="190" y="102">T</text><text x="15" y="235">R=5, r=3, d=2</text></g>
<g transform="translate(650,65)"><text x="15" y="0">Two intersections: not contact</text><circle cx="100" cy="115" r="90" fill="#87b5ef" fill-opacity=".2" stroke="#2465a8" stroke-width="2"/><circle cx="208" cy="115" r="90" fill="#efbc87" fill-opacity=".2" stroke="#bd6a1a" stroke-width="2"/><line x1="154" y1="43" x2="154" y2="187" stroke="#934747" stroke-width="2"/><circle cx="154" cy="43" r="4" fill="#a32c2c"/><circle cx="154" cy="187" r="4" fill="#a32c2c"/><circle cx="154" cy="115" r="4" fill="#222"/><text x="160" y="44">A</text><text x="160" y="190">B</text><text x="160" y="112">M</text><text x="15" y="235">R=r=5, d=6; A=(3,4), B=(3,-4)</text></g></g></svg>
