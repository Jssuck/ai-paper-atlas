<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="510" viewBox="0 0 1000 510"><rect width="1000" height="510" fill="#fafafa"/><style>text{font-family:Arial,sans-serif;fill:#182332;font-size:16px}.small{font-size:13px}</style><text x="250" y="32" text-anchor="middle">One midpoint is possible</text><circle cx="250" cy="245" r="170" fill="#eef4fa" stroke="#8e9ba9" stroke-width="2"/><line x1="114.0" y1="143.0" x2="386.0" y2="143.0" stroke="#146baf" stroke-width="3"/><line x1="352.0" y1="109.0" x2="86.80000000000001" y2="197.4" stroke="#bb4d20" stroke-width="3"/><circle cx="114.0" cy="143.0" r="4" fill="#182332"/><text x="94.0" y="161.0">A</text><circle cx="352.0" cy="109.0" r="4" fill="#182332"/><text x="357.0" y="99.0">B</text><circle cx="386.0" cy="143.0" r="4" fill="#182332"/><text x="394.0" y="160.0">C</text><circle cx="86.80000000000001" cy="197.4" r="4" fill="#182332"/><text x="62.80000000000001" y="213.4">D</text><circle cx="250.0" cy="245.0" r="4" fill="#182332"/><text x="258.0" y="265.0">O</text><circle cx="250.0" cy="143.0" r="4" fill="#182332"/><text x="258.0" y="163.0">E</text><text class="small" x="250" y="465" text-anchor="middle">AC is bisected; BD is not. Both are non-diameters.</text><text x="750" y="32" text-anchor="middle">Two midpoints: center intersection</text><circle cx="750" cy="245" r="170" fill="#eef4fa" stroke="#8e9ba9" stroke-width="2"/><line x1="580.0" y1="245.0" x2="920.0" y2="245.0" stroke="#146baf" stroke-width="3"/><line x1="852.0" y1="109.0" x2="648.0" y2="381.0" stroke="#bb4d20" stroke-width="3"/><circle cx="580.0" cy="245.0" r="4" fill="#182332"/><text x="560.0" y="263.0">A</text><circle cx="852.0" cy="109.0" r="4" fill="#182332"/><text x="857.0" y="99.0">B</text><circle cx="920.0" cy="245.0" r="4" fill="#182332"/><text x="928.0" y="262.0">C</text><circle cx="648.0" cy="381.0" r="4" fill="#182332"/><text x="624.0" y="397.0">D</text><circle cx="750.0" cy="245.0" r="4" fill="#182332"/><text x="758.0" y="265.0">E = O</text><text class="small" x="750" y="465" text-anchor="middle">Both chords are diameters: outside III.4 hypotheses.</text></svg>