<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="480" viewBox="0 0 1260 480" role="img" aria-labelledby="title desc"><title id="title">Three models, the same two premises</title><desc id="desc">A is a subset of B and C is disjoint from A in all panels. C may be outside B, inside B, or overlap B. Only the labeled dots a,b,c are objects.</desc><rect width="1260" height="480" fill="#f5f7fb"/><g font-family="DejaVu Sans, sans-serif" fill="#172b4d"><text x="35" y="40" font-size="25" font-weight="bold">Same premises. Different C-to-B relationships.</text><text x="35" y="70" font-size="17">A = {a}, B = {a,b}, U = {a,b,c}. Only the labeled dots are objects.</text><g transform="translate(0,0)"><rect x="15" y="90" width="400" height="315" rx="14" fill="white" stroke="#d2dae8"/><text x="35" y="122" font-size="19" font-weight="bold">1. C outside B</text><circle cx="190" cy="255" r="105" fill="#e7effe" stroke="#3b67a5" stroke-width="2.5"/><circle cx="135" cy="255" r="35" fill="#bdd0ee" stroke="#244d83" stroke-width="2.5"/><circle cx="365" cy="255" r="25" fill="#a9dfcc" fill-opacity="0.38" stroke="#1b8063" stroke-width="2.5"/><text x="175" y="178" font-size="23">B</text><text x="125" y="241" font-size="20">A</text><text x="358" y="220" font-size="22" fill="#15634d">C</text><circle cx="135" cy="255" r="5" fill="#15263e"/><text x="130" y="278" font-size="18">a</text><circle cx="255" cy="255" r="5" fill="#15263e"/><text x="250" y="278" font-size="18">b</text><circle cx="365" cy="255" r="5" fill="#15263e"/><text x="360" y="278" font-size="18">c</text><text x="35" y="385" font-size="19">C = {c}</text><text x="25" y="433" font-size="11.8">All: false   None: true   Some: false   Some-not: true</text></g><g transform="translate(420,0)"><rect x="15" y="90" width="400" height="315" rx="14" fill="white" stroke="#d2dae8"/><text x="35" y="122" font-size="19" font-weight="bold">2. C inside B</text><circle cx="190" cy="255" r="105" fill="#e7effe" stroke="#3b67a5" stroke-width="2.5"/><circle cx="135" cy="255" r="35" fill="#bdd0ee" stroke="#244d83" stroke-width="2.5"/><circle cx="255" cy="255" r="25" fill="#a9dfcc" fill-opacity="0.38" stroke="#1b8063" stroke-width="2.5"/><text x="175" y="178" font-size="23">B</text><text x="125" y="241" font-size="20">A</text><text x="248" y="220" font-size="22" fill="#15634d">C</text><circle cx="135" cy="255" r="5" fill="#15263e"/><text x="130" y="278" font-size="18">a</text><circle cx="255" cy="255" r="5" fill="#15263e"/><text x="250" y="278" font-size="18">b</text><circle cx="365" cy="255" r="5" fill="#15263e"/><text x="360" y="278" font-size="18">c</text><text x="35" y="385" font-size="19">C = {b}</text><text x="25" y="433" font-size="11.8">All: true   None: false   Some: true   Some-not: false</text></g><g transform="translate(840,0)"><rect x="15" y="90" width="400" height="315" rx="14" fill="white" stroke="#d2dae8"/><text x="35" y="122" font-size="19" font-weight="bold">3. C overlaps B</text><circle cx="190" cy="255" r="105" fill="#e7effe" stroke="#3b67a5" stroke-width="2.5"/><circle cx="135" cy="255" r="35" fill="#bdd0ee" stroke="#244d83" stroke-width="2.5"/><circle cx="310" cy="255" r="85" fill="#a9dfcc" fill-opacity="0.38" stroke="#1b8063" stroke-width="2.5"/><text x="175" y="178" font-size="23">B</text><text x="125" y="241" font-size="20">A</text><text x="303" y="160" font-size="22" fill="#15634d">C</text><circle cx="135" cy="255" r="5" fill="#15263e"/><text x="130" y="278" font-size="18">a</text><circle cx="255" cy="255" r="5" fill="#15263e"/><text x="250" y="278" font-size="18">b</text><circle cx="365" cy="255" r="5" fill="#15263e"/><text x="360" y="278" font-size="18">c</text><text x="35" y="385" font-size="19">C = {b,c}</text><text x="25" y="433" font-size="11.8">All: false   None: false   Some: true   Some-not: true</text></g><text x="35" y="465" font-size="16">Each panel satisfies A subset B and C disjoint A. No one of the four C-to-B statements follows.</text></g></svg>
