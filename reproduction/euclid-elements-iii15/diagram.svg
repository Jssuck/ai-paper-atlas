<svg xmlns="http://www.w3.org/2000/svg" width="800" height="470" viewBox="0 0 800 470" role="img" aria-labelledby="title desc"><title id="title">III.15: diameter and ordered chords</title><desc id="desc">Circle of radius 5, diameter 10, chord length 8 at distance 3, chord length 6 at distance 4. Distances are nonnegative.</desc><rect width="800" height="470" fill="#f8fafc"/><text x="35" y="38" font-family="sans-serif" font-size="23" fill="#0f172a">III.15 · Longer chords lie nearer the center</text><g stroke-width="3" fill="none"><circle cx="250" cy="255" r="170" stroke="#94a3b8"/><path d="M80 255H420" stroke="#334155"/><path d="M114 153H386" stroke="#2563eb"/><path d="M148 119H352" stroke="#ea580c"/><path d="M250 255V119" stroke="#16a34a" stroke-dasharray="6 5"/><path d="M250 153h10v10h-10M250 119h10v10h-10" stroke="#16a34a" stroke-width="2"/></g><g font-family="sans-serif" font-size="18" fill="#0f172a"><text x="263" y="279">O</text><text x="111" y="145">A</text><text x="388" y="145">B</text><text x="130" y="112">C</text><text x="354" y="112">D</text><text x="275" y="212" fill="#15803d">d = 3</text><text x="203" y="197" fill="#15803d">4</text><text x="476" y="133" fill="#ea580c">CD = 6, distance = 4</text><text x="476" y="180" fill="#2563eb">AB = 8, distance = 3</text><text x="476" y="227">Diameter = 10, distance = 0</text><text x="476" y="298">6 &lt; 8 &lt; 10</text><text x="476" y="335">4 &gt; 3 &gt; 0</text><text x="35" y="451" font-size="15">Original coordinate illustration; a finite example does not prove the theorem.</text></g><circle cx="250" cy="255" r="4" fill="#0f172a"/></svg>
