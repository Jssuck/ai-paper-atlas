<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="560" viewBox="0 0 1440 560" role="img" aria-labelledby="title desc"><title id="title">I.40 六点教学模型：内点、延长、等积</title><desc id="desc">三栏使用 B=(0,0)、C=(4,0)、E=(6,0)、F=(10,0)。前两栏仅演示反证构造，不满足等积；第三栏等积且 G=D。蓝色为 ABC，绿色为 DEF，橙色为差片 GDF。</desc><rect width="1440" height="560" fill="#f5f8fc"/><style>text{font-family:"Noto Sans CJK SC",sans-serif;fill:#172b42}.head{font-size:23px;font-weight:600}.title{font-size:20px;font-weight:600}.note{font-size:16px}.label{font-size:18px;font-weight:600}</style><text x="24" y="35" class="head">I.40：同一构造的三个分支 · 原创现代坐标教学图</text>
<rect x="16" y="58" width="460" height="450" rx="12" fill="white" stroke="#cfdae6"/><text x="34" y="91" class="title">内点：t = 1/2</text><text x="34" y="119" class="note">A=(1,2)；D=(9,4)；G=(7.5,2)</text>
