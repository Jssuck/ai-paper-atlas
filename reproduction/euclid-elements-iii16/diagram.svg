<svg xmlns="http://www.w3.org/2000/svg" width="840" height="460" viewBox="0 0 840 460" role="img" aria-labelledby="title desc"><title id="title">III.16 tangent and inward ray</title><desc id="desc">A circle with center O above contact P; horizontal tangent; an inclined ray enters the disk at W and exits at Q. Diagram is an original modern reconstruction.</desc><rect width="840" height="460" fill="#fafafa"/><g font-family="sans-serif" fill="#18212b"><text x="35" y="32" font-size="22">III.16 — tangent, inward ray, interior witness</text><circle cx="240" cy="220" r="160" fill="#e8f4ff" stroke="#28619c" stroke-width="3"/><line x1="30" y1="380" x2="800" y2="380" stroke="#222" stroke-width="3"/><line x1="240" y1="380" x2="240" y2="60" stroke="#777" stroke-dasharray="7 5"/><line x1="240" y1="380" x2="600" y2="110" stroke="#bf4a24" stroke-width="3"/><circle cx="240" cy="380" r="5"/><circle cx="240" cy="220" r="5"/><circle cx="393.6" cy="264.8" r="5" fill="#bf4a24"/><circle cx="316.8" cy="322.4" r="5" fill="#29865c"/><line x1="240" y1="220" x2="316.8" y2="322.4" stroke="#29865c" stroke-dasharray="5 4"/><path d="M240 365h15v15" fill="none" stroke="#222"/><text x="218" y="405" font-size="20">P</text><text x="214" y="218" font-size="20">O</text><text x="403" y="264" font-size="20">Q</text><text x="326" y="334" font-size="20">W</text><text x="620" y="370" font-size="18">tangent</text><text x="570" y="96" font-size="18">inward ray</text><text x="540" y="235" font-size="18">P: boundary contact</text><text x="540" y="265" font-size="18">W: strict interior point</text><text x="540" y="295" font-size="18">Q: second intersection</text><text x="35" y="438" font-size="15">Modern coordinate diagram; no positive real magnitude is assigned to the horn angle.</text></g></svg>
