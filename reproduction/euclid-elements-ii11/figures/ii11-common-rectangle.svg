<circle cx="340.13155617496426" cy="89.86844382503574" r="3" fill="#172331"/><text x="350.13155617496426" y="81.86844382503574" font-size="20" font-family="sans-serif">G</text>
<circle cx="340.13155617496426" cy="300" r="3" fill="#172331"/><text x="347.13155617496426" y="290" font-size="20" font-family="sans-serif">H</text>
