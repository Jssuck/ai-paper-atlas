<text x="185" y="190" font-size="18" font-family="sans-serif">FH = x²</text>
<text x="180" y="475" font-size="18" font-family="sans-serif">AK = ax</text>
<text x="355" y="475" font-size="18" font-family="sans-serif">HD = a(a-x)</text>
<text x="45" y="705" font-size="18" font-family="sans-serif">FK = AD; remove AK from both.</text>
<text x="45" y="738" font-size="18" font-family="sans-serif">Drawing rounded; algebraic checks use exact Q(sqrt(5)).</text>
