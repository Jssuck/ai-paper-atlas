<circle cx="130" cy="300" r="3" fill="#172331"/><text x="105" y="291" font-size="20" font-family="sans-serif">A</text>
<circle cx="470" cy="300" r="3" fill="#172331"/><text x="480" y="291" font-size="20" font-family="sans-serif">B</text>
