<svg xmlns="http://www.w3.org/2000/svg" width="700" height="780" viewBox="0 0 700 780">
<rect width="700" height="780" fill="white"/>
<text x="45" y="35" font-size="22" font-family="sans-serif">II.11: subtract the same rectangle AK</text>
