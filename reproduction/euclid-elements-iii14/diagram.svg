<svg xmlns="http://www.w3.org/2000/svg" width="840" height="510" viewBox="0 0 840 510">
<rect width="840" height="510" fill="#faf9f5"/>
<text x="32" y="35" font-family="sans-serif" font-size="24" fill="#162b3d">III.14 · Equal chords and equal distances</text>
<text x="32" y="62" font-family="sans-serif" font-size="15" fill="#465568">Original teaching diagram. Radius 5; chord length 8; unsigned distance 3.</text>
<circle cx="235" cy="275" r="175" fill="#edf4fa" stroke="#31546c" stroke-width="2"/>
<line x1="95" y1="170" x2="375" y2="170" stroke="#126b87" stroke-width="4"/>
<line x1="95" y1="380" x2="375" y2="380" stroke="#bd512c" stroke-width="4"/>
<line x1="235" y1="170" x2="235" y2="380" stroke="#536676" stroke-width="2" stroke-dasharray="6 4"/>
<path d="M235 182h12v-12 M235 368h12v12" fill="none" stroke="#536676"/>
<g fill="#162b3d" font-family="sans-serif" font-size="18"><text x="75" y="162">A</text><text x="382" y="162">B</text><text x="75" y="401">C</text><text x="382" y="401">D</text><text x="212" y="163">M</text><text x="211" y="400">N</text><text x="211" y="290">O</text><text x="248" y="230">3</text><text x="248" y="334">3</text></g>
<circle cx="235" cy="275" r="4" fill="#162b3d"/>
<g font-family="sans-serif" fill="#162b3d"><text x="460" y="150" font-size="20">Same circle, opposite sides</text><text x="460" y="184" font-size="18">AB = CD = 8</text><text x="460" y="214" font-size="18">OM = ON = 3</text><text x="460" y="255" font-size="17">Half-chord squared: 4² = 16</text><text x="460" y="285" font-size="17">Distance squared: 3² = 9</text><text x="460" y="315" font-size="17">16 + 9 = 25 = radius²</text><text x="460" y="366" font-size="16">Distance is not a signed coordinate.</text><text x="460" y="397" font-size="16">For a diameter, the foot is O</text><text x="460" y="421" font-size="16">and the distance is zero.</text></g>
<text x="32" y="486" font-family="sans-serif" font-size="14" fill="#465568">The figure illustrates one case; it does not prove the general equivalence.</text>
</svg>
