<svg xmlns="http://www.w3.org/2000/svg" width="820" height="470" viewBox="0 0 820 470"><rect width="820" height="470" fill="white"/><style>text{font-family:sans-serif;font-size:17px}.small{font-size:14px}</style><text x="25" y="30">III.18 — tangent versus an oblique line</text><circle cx="270" cy="240" r="150" fill="#e9f2ff" stroke="#2563eb" stroke-width="3"/><line x1="420" y1="55" x2="420" y2="435" stroke="#15803d" stroke-width="3"/><line x1="270" y1="240" x2="420" y2="240" stroke="#333" stroke-width="2"/><line x1="230" y1="430" x2="580" y2="80" stroke="#dc2626" stroke-width="3"/><line x1="270" y1="240" x2="345" y2="315" stroke="#92400e" stroke-width="2" stroke-dasharray="5 5"/><circle cx="270" cy="240" r="4"/><circle cx="420" cy="240" r="4"/><circle cx="345" cy="315" r="5" fill="#dc2626"/><text x="246" y="225">O</text><text x="429" y="252">B</text><text x="350" y="340">H</text><text x="435" y="69" fill="#15803d">tangent: v = (0,1)</text><text x="520" y="185" fill="#dc2626">oblique: v = (1,1)</text><text x="535" y="220">O = (0,0), r = 3</text><text x="535" y="250">B = (3,0)</text><text x="535" y="280">H = (3/2,-3/2)</text><text x="535" y="310">power(H) = -9/2</text><text x="25" y="459" class="small">Original teaching diagram. H is strictly inside. Coordinates use upward-positive y.</text></svg>
