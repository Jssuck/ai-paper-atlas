<circle cx="240" cy="80" r="4" fill="#182d42"/><text class="label" x="249" y="72">C</text>
<circle cx="240" cy="440" r="4" fill="#182d42"/><text class="label" x="249" y="458">E</text>
<circle cx="240" cy="260" r="4" fill="#182d42"/><text class="label" x="250" y="282">F</text>
<circle cx="240" cy="116" r="4" fill="#182d42"/><text class="label" x="250" y="107">D</text>
