<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="Convex cyclic quadrilateral and crossed vertex order">
<rect width="1200" height="480" fill="white"/>
<g font-family="sans-serif" font-size="22" fill="#17243a">
<text x="300" y="38" text-anchor="middle">Boundary order A-B-C-D</text><circle cx="300" cy="235" r="155" fill="#f5f8ff" stroke="#94a3b8" stroke-width="2"/>
<polygon points="455,235 300,80 145,235 300,390" fill="none" stroke="#167d93" stroke-width="4"/>
<line x1="455" y1="235" x2="145" y2="235" stroke="#bb6b1f" stroke-width="2" stroke-dasharray="7 5"/>
<line x1="300" y1="80" x2="300" y2="390" stroke="#bb6b1f" stroke-width="2" stroke-dasharray="7 5"/>
<circle cx="455" cy="235" r="5" fill="#17243a"/><text x="475" y="242" text-anchor="middle">A</text>
<circle cx="300" cy="80" r="5" fill="#17243a"/><text x="300" y="62" text-anchor="middle">B</text>
<circle cx="145" cy="235" r="5" fill="#17243a"/><text x="125" y="242" text-anchor="middle">C</text>
<circle cx="300" cy="390" r="5" fill="#17243a"/><text x="300" y="420" text-anchor="middle">D</text>
<text x="300" y="460" text-anchor="middle" font-size="19">Opposite interior angles: 90 + 90 = 180</text>
<text x="900" y="38" text-anchor="middle">Crossed order: excluded</text><circle cx="900" cy="235" r="155" fill="#f5f8ff" stroke="#94a3b8" stroke-width="2"/>
<polygon points="1055,235 745,235 900,80 900,390" fill="none" stroke="#167d93" stroke-width="4"/>
<circle cx="1055" cy="235" r="5" fill="#17243a"/><text x="1075" y="242" text-anchor="middle">A</text>
<circle cx="745" cy="235" r="5" fill="#17243a"/><text x="725" y="242" text-anchor="middle">B</text>
<circle cx="900" cy="80" r="5" fill="#17243a"/><text x="900" y="62" text-anchor="middle">C</text>
<circle cx="900" cy="390" r="5" fill="#17243a"/><text x="900" y="420" text-anchor="middle">D</text>
<text x="900" y="460" text-anchor="middle" font-size="19">Nonreflex opposite angles: 45 + 45 = 90</text>
</g></svg>
